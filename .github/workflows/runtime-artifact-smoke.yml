name: Runtime artifact smoke

on:
  workflow_dispatch:
    inputs:
      baseline_version:
        description: Canonical baseline Tailscale version
        default: '1.102.4'
        required: true
      target_version:
        description: Canonical target Tailscale version
        default: '1.104.4'
        required: true
  push:
    paths:
      - 'scripts/runtime_artifact_smoke.py'
      - '.github/workflows/runtime-artifact-smoke.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  artifact:
    name: Isolated Linux amd64 version probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check manifest
        run: python scripts/source_manifest.py --check
      - name: Verify official archives and run version-only probes without networking
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version || '1.102.4' }}
          TARGET_VERSION: ${{ inputs.target_version || '1.104.4' }}
        run: python scripts/runtime_artifact_smoke.py --versions "$BASELINE_VERSION" "$TARGET_VERSION"
