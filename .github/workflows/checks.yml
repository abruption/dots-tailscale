name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure installer test tools are installed
        run: |
          if ! command -v ssh >/dev/null || ! test -x /usr/sbin/sshd || ! command -v cc >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes openssh-client openssh-server gcc
          fi
      - name: Check source manifest
        run: python scripts/source_manifest.py --check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: bash -n tailscale-setup.sh
      - name: Ensure ShellCheck is installed
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
      - name: Run ShellCheck
        run: shellcheck tailscale-setup.sh

  python-static:
    name: Python static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned static checker
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-static.txt
      - name: Verify the checker rejects an invalid fixture
        run: python scripts/check_python_static.py --self-test
      - name: Check tracked Python sources including dots-ts and research
        run: python scripts/check_python_static.py
