name: Research checks

on:
  push:
    paths: ['research/**', '.github/workflows/research-checks.yml']
  pull_request:
    paths: ['research/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  research:
    name: Research Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked research dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r research/mcp-events/requirements.lock
      - name: Validate recovery coordination and transport
        working-directory: research/mcp-events
        run: python -m unittest discover -v
      - name: Validate bounded lifecycle collector
        working-directory: research/lifecycle-20
        run: python -m unittest discover -v
