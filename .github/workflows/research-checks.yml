name: Research checks

on:
  push:
    paths: ['research/**', '.github/workflows/research-checks.yml']
  pull_request:
    paths: ['research/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  research:
    name: Research Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked research dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r research/mcp-events/requirements.lock
      - name: Validate recovery coordination and transport
        working-directory: research/mcp-events
        run: python -m unittest discover -v
      - name: Validate bounded lifecycle collector
        working-directory: research/lifecycle-20
        run: python -m unittest discover -v
