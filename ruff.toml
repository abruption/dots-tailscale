# A correctness gate, not a formatter or a security audit.
target-version = "py38"
extend-include = ["dots-ts"]

[per-file-target-version]
"research/**/*.py" = "py312"
"scripts/*.py" = "py311"

[lint]
# Syntax errors, invalid comparisons/control flow, and undefined names.
# Existing compact formatting is intentionally outside this gate's scope.
select = ["E9", "F63", "F7", "F82"]
